<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Retailer &times; Hour Fulfilment Heatmap — Instacart Sigma Plugin</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;background:transparent;color:#003D29;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:12px 14px;gap:8px}
  #top{display:flex;justify-content:space-between;align-items:baseline;flex:0 0 auto}
  #ttl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0AAD0A}
  #meta{font-size:11px;color:#5B6B7F}
  #meta b{color:#003D29}
  #grid{flex:1;min-height:0;display:grid;gap:4px}
  .rowlabel{display:flex;align-items:center;font-size:11px;font-weight:700;color:#003D29;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .collabel{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#5B6B7F}
  .cell{position:relative;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;transition:transform .08s;min-height:0}
  .cell:hover{transform:scale(1.04)}
  .idx{font-size:15px;font-weight:800;line-height:1}
  .st{position:absolute;left:6px;right:6px;bottom:5px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
  .st > i{display:block;height:100%;border-radius:2px;background:#FF7009}
  #legend{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:10px;color:#5B6B7F}
  #ramp{height:8px;flex:1;border-radius:4px;background:linear-gradient(90deg,#FF7009,#F4F1EA,#0AAD0A)}
  #tip{position:fixed;pointer-events:none;background:#003D29;border-radius:8px;padding:8px 10px;font-size:11px;color:#fff;opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #tip b{color:#FF7009}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="ttl">Retailer &times; Hour Fulfilment</div><div id="meta"><b id="ncount">0</b> retailers &middot; avg on-time <b id="stavg">&mdash;</b></div></div>
  <div id="grid"></div>
  <div id="legend">Item fill rate %<div id="ramp"></div><span>below &middot; target &middot; above</span></div>
</div>
<div id="tip"></div>
<script>
(function(){
  var DAYPARTS = ["Early AM","Late AM","Lunch","Afternoon","Evening","Late"];

  var client = (window.sigmaComputing && window.sigmaComputing.plugin && window.sigmaComputing.plugin.client) ||
               (window.SigmaPlugin && window.SigmaPlugin.client) || null;
  var painted = false;
  var defs = [
    {name:'source', type:'element'},
    {name:'retailer', type:'column', source:'source', label:'Retailer'},
    {name:'hourblock', type:'column', source:'source', label:'Hour Block'},
    {name:'fillrate', type:'column', source:'source', allowedTypes:['number','integer'], label:'Fill Rate %'},
    {name:'ontime', type:'column', source:'source', allowedTypes:['number','integer'], label:'On-Time %'},
    {name:'status', type:'column', source:'source', label:'Status'}
  ];
  if (client) client.config.configureEditorPanel(defs);

  var tip = document.getElementById('tip');
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  // Diverging red -> pale -> teal, centred on 100 (plan)
  function colorFor(idx){
    if (idx==null || isNaN(idx)) return '#EEF2F7';
    var lo=86, mid=92, hi=97;
    if (idx<=mid){ var t=Math.max(0,Math.min(1,(idx-lo)/(mid-lo))); return mix('#FF7009','#F4F1EA',t); }
    var t2=Math.max(0,Math.min(1,(idx-mid)/(hi-mid))); return mix('#F4F1EA','#0AAD0A',t2);
  }
  function mix(a,b,t){
    function h2r(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    var A=h2r(a),B=h2r(b);
    var r=Math.round(A[0]+(B[0]-A[0])*t), g=Math.round(A[1]+(B[1]-A[1])*t), bl=Math.round(A[2]+(B[2]-A[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function textOn(idx){ return (idx!=null && idx>=92) ? '#002116' : '#5A2A06'; }

  function synth(){
    // Mirrors company.py's fulfillment_heatmap_sql() so the unbound preview reads
    // as real Instacart data, not placeholder rows.
    var rows = [
      ["Big-box retailers","Early AM",94.1,96.2,"Ahead"],
      ["Big-box retailers","Late AM",93.4,95.1,"On plan"],
      ["Big-box retailers","Lunch",91.8,93.4,"On plan"],
      ["Big-box retailers","Afternoon",92.6,94.8,"On plan"],
      ["Big-box retailers","Evening",89.2,90.1,"Behind"],
      ["Big-box retailers","Late",90.4,92.6,"On plan"],
      ["Club & warehouse","Early AM",95.6,96.8,"Ahead"],
      ["Club & warehouse","Late AM",94.9,96.0,"Ahead"],
      ["Club & warehouse","Lunch",93.1,94.2,"On plan"],
      ["Club & warehouse","Afternoon",93.8,95.4,"Ahead"],
      ["Club & warehouse","Evening",90.7,91.8,"On plan"],
      ["Club & warehouse","Late",91.5,93.0,"On plan"],
      ["Regional grocers","Early AM",92.2,94.6,"On plan"],
      ["Regional grocers","Late AM",91.5,93.8,"On plan"],
      ["Regional grocers","Lunch",89.4,91.2,"Behind"],
      ["Regional grocers","Afternoon",90.8,92.4,"On plan"],
      ["Regional grocers","Evening",87.6,88.9,"Behind"],
      ["Regional grocers","Late",88.9,91.0,"Behind"],
      ["Natural & specialty","Early AM",93.0,95.2,"Ahead"],
      ["Natural & specialty","Late AM",92.7,94.8,"On plan"],
      ["Natural & specialty","Lunch",90.6,92.1,"On plan"],
      ["Natural & specialty","Afternoon",91.9,93.7,"On plan"],
      ["Natural & specialty","Evening",88.8,90.3,"Behind"],
      ["Natural & specialty","Late",89.7,91.6,"On plan"],
      ["Convenience & pharmacy","Early AM",96.1,97.4,"Ahead"],
      ["Convenience & pharmacy","Late AM",95.8,96.9,"Ahead"],
      ["Convenience & pharmacy","Lunch",94.7,95.8,"Ahead"],
      ["Convenience & pharmacy","Afternoon",95.2,96.4,"Ahead"],
      ["Convenience & pharmacy","Evening",93.4,94.6,"On plan"],
      ["Convenience & pharmacy","Late",94.0,95.5,"Ahead"]
    ];
    return rows.map(function(r){ return {network:r[0], daypart:r[1], rating:r[2], sellthrough:r[3], status:r[4]}; });
  }

  function render(data){
    painted = true;
    var networks = [];
    data.forEach(function(d){ if (networks.indexOf(d.network)===-1) networks.push(d.network); });
    var byKey = {};
    data.forEach(function(d){ byKey[d.network+'|||'+d.daypart] = d; });

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = '128px repeat(' + DAYPARTS.length + ', 1fr)';
    grid.style.gridTemplateRows = '22px repeat(' + networks.length + ', 1fr)';

    var corner = document.createElement('div');
    grid.appendChild(corner);
    DAYPARTS.forEach(function(dp){
      var h = document.createElement('div'); h.className='collabel'; h.textContent = dp;
      grid.appendChild(h);
    });

    var stSum = 0, stN = 0;
    networks.forEach(function(net){
      var rl = document.createElement('div'); rl.className='rowlabel'; rl.textContent = net;
      grid.appendChild(rl);
      DAYPARTS.forEach(function(dp){
        var d = byKey[net+'|||'+dp];
        var cell = document.createElement('div'); cell.className='cell';
        var idx = d ? d.rating : null;
        cell.style.background = colorFor(idx);
        var num = document.createElement('div'); num.className='idx';
        num.style.color = textOn(idx);
        num.textContent = (idx==null) ? '—' : idx.toFixed(1);
        cell.appendChild(num);
        if (d && d.sellthrough!=null){
          var bar = document.createElement('div'); bar.className='st';
          var fill = document.createElement('i'); fill.style.width = Math.max(0,Math.min(100,d.sellthrough)) + '%';
          bar.appendChild(fill); cell.appendChild(bar);
          stSum += d.sellthrough; stN++;
        }
        cell.addEventListener('mousemove', function(e){
          tip.style.opacity = 1;
          tip.style.left = (e.clientX+14)+'px'; tip.style.top=(e.clientY+10)+'px';
          tip.innerHTML = '<b>'+esc(net)+'</b> &middot; '+esc(dp)+
            '<br>Rating index: '+((idx==null)?'—':idx.toFixed(1))+'%'+
            '<br>On-time: '+((d&&d.sellthrough!=null)?d.sellthrough.toFixed(1)+'%':'—')+
            '<br>Status: '+esc((d&&d.status)||'—');
        });
        cell.addEventListener('mouseleave', function(){ tip.style.opacity = 0; });
        grid.appendChild(cell);
      });
    });

    document.getElementById('ncount').textContent = networks.length;
    document.getElementById('stavg').textContent = stN ? (stSum/stN).toFixed(1)+'%' : '—';
  }

  var unsub = null;
  function bind(cfg){
    if (unsub){ unsub(); unsub = null; }
    if (!client || !cfg || !cfg.source || !cfg.retailer || !cfg.hourblock){ render(synth()); return; }
    unsub = client.elements.subscribeToElementData(cfg.source, function(elData){
      if (!elData || !elData[cfg.retailer]){ render(synth()); return; }
      var n = elData[cfg.retailer].length;
      var rows = [];
      for (var i=0; i<n; i++){
        rows.push({
          network: elData[cfg.retailer][i],
          daypart: elData[cfg.hourblock][i],
          rating: cfg.fillrate ? Number(elData[cfg.fillrate][i]) : null,
          sellthrough: cfg.ontime ? Number(elData[cfg.ontime][i]) : null,
          status: cfg.status ? elData[cfg.status][i] : null
        });
      }
      render(rows);
    });
  }

  // Ordering is load-bearing (same finding as osrs-ge-offer-grid): register
  // the config handler FIRST, before painting, then fall back to sample data
  // only if nothing has painted shortly after.
  if (client){
    try { client.config.subscribe(function(cfg){ bind(cfg); }); } catch (e) {}
  }
  setTimeout(function(){ if (!painted) render(synth()); }, 900);

  // ResizeObserver on the stage element, not a window resize listener, and no
  // animation loop -- headless PNG export must be able to reach idle.
  var ro = new ResizeObserver(function(){ /* CSS grid reflows on its own */ });
  ro.observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
